<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js');</script>
  <title>Links — Victor Brito</title>
  <meta name="description" content="Victor Brito, Product, UX e Visual Designer. LinkedIn, WhatsApp, email, Instagram e portfólio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-bg-alt: #040505;
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, .75);
      --color-primary: #0509ff;
      --container: 1008px;
      --gutter: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* Página de links (link na bio do Instagram): fundo escuro com brilho azul no topo */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(70% 60% at 50% 18%, rgba(5, 9, 255, .3), transparent 70%),
        var(--color-bg-alt);
      color: var(--color-text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .container {
      width: 100%;
      max-width: calc(var(--container) + var(--gutter) * 2);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: var(--color-text);
      font-weight: 700;
      border: 1px solid transparent;
      border-radius: 360px;
      white-space: nowrap;
      transition: filter .2s ease, transform .3s ease-out;
    }
    .btn:hover { filter: brightness(1.15); transform: translateY(-4px); }
    .btn:active { transform: scale(.97); }

    /* Header (mesmo das outras páginas, mas transparente sobre o brilho) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 0;
      transition: background-color .3s ease, box-shadow .3s ease;
    }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .header__logo img { width: 40px; height: 40px; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
    .header__logo:hover img { transform: rotate(-12deg) scale(1.08); }
    .nav { display: flex; align-items: center; gap: 24px; font-size: 14px; }
    .nav__link:hover { opacity: .75; }
    .nav__link[aria-current="page"] { font-weight: 700; }
    .nav .btn { width: 88px; padding: 4px 6px; font-size: 14px; }

    main { flex: 1; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 48px;
      max-width: calc(720px + var(--gutter) * 2);
      padding-top: 72px;
      padding-bottom: 96px;
    }

    /* Perfil */
    .profile { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
    .profile__photo {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, .12);
    }
    .profile__name { margin: 0; font-size: 48px; font-weight: 900; line-height: 1.1; }
    .profile__role { margin: 4px 0 0; font-size: 18px; color: var(--color-text-muted); }
    .profile__status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 10px;
      background: rgba(45, 44, 45, .32);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 360px;
      font-size: 12px;
      font-weight: 700;
    }
    .profile__status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #25d366; box-shadow: 0 0 0 4px rgba(37, 211, 102, .15); }

    /* cards em duas colunas no desktop */
    .links .mcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .links .mcards__label { grid-column: 1 / -1; margin: 0; }

    .site-footer { padding: 12px 0; }
    .site-footer .container { display: flex; justify-content: center; }
    .site-footer img { width: 40px; height: 40px; }

    /* Animações de entrada (mesmas das outras páginas) */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translate3d(0, 64px, 0); }
      to   { opacity: 1; transform: none; }
    }
    .js [data-reveal] { opacity: 0; }
    .js [data-reveal].is-visible { opacity: 1; animation: fadeInUp .9s cubic-bezier(.2, .7, .2, 1) var(--delay, 0s) backwards; }

    /* Mobile (Figma "Links — Mobile": coluna única, logo centralizado e sem menu) */
    @media (max-width: 600px) {
      :root { --gutter: 20px; }
      .header { justify-content: center; }
      .nav, .menu-btn { display: none !important; }
      .links { gap: 32px; padding-top: 20px; padding-bottom: 40px; }
      .profile__photo { width: 112px; height: 112px; }
      .profile__name { font-size: 32px; }
      .profile__role { font-size: 16px; }
      .links .mcards { grid-template-columns: 1fr; gap: 12px; }
      .site-footer { display: none; }
    }
    /* Tipografia mobile um degrau menor; o corpo de texto segue em 16px */
    @media (max-width: 600px) {
      .profile__name { font-size: 28px; }
    }
  </style>
  <link rel="stylesheet" href="assets/liquid-glass.css">
  <link rel="stylesheet" href="assets/menu.css">
</head>
<body>
  <div class="site-header">
    <header class="container header">
      <a href="index.html" class="header__logo" aria-label="Início">
        <img src="assets/logo.png" alt="Logo Victor Brito" width="40" height="40">
      </a>
      <nav class="nav">
        <a href="sobre.html" class="nav__link">Sobre mim</a>
        <a href="links.html" class="nav__link" aria-current="page">Links</a>
        <a href="https://api.whatsapp.com/send/?phone=5511976625372&amp;text&amp;type=phone_number&amp;app_absent=0" target="_blank" rel="noopener" class="btn">Contato</a>
      </nav>
    </header>
  </div>

  <main class="container links">
    <section class="profile" aria-labelledby="perfil-nome">
      <img class="profile__photo" src="assets/foto-perfil.png" alt="Foto de Victor Brito sorrindo, de óculos" width="1024" height="1024" data-reveal>
      <div data-reveal style="--delay: .1s">
        <h1 class="profile__name" id="perfil-nome">Victor Brito</h1>
        <p class="profile__role">Product, UX e Visual Designer</p>
      </div>
      <span class="profile__status" data-reveal style="--delay: .2s">Disponível para projetos</span>
    </section>

    <div data-links="Links" data-reveal style="--delay: .3s"></div>
    <div data-links="Portfólio" data-links-set="portfolio" data-reveal style="--delay: .4s"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img src="assets/logo.png" alt="Logo Victor Brito" width="40" height="40">
    </div>
  </footer>

  <script>
    (function () {
      const header = document.querySelector('.site-header');
      const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 8);
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });

      /* a página é curta: tudo entra em sequência assim que carrega */
      requestAnimationFrame(() => {
        document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('is-visible'));
      });
    })();
  </script>
  <script src="assets/menu.js"></script>
  <script src="assets/liquid-glass.js"></script>
</body>
</html>
